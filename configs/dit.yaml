seed: 123

# ============================================================
# DiT Model
# ============================================================

model:
  name: dit
  variant: DiT-B

  attention:
    type: rope

  dit:
    cfg_dropout: 0.1
    dropout: 0.0
    grid_h: 32
    grid_w: 32
    latent_dim: 4
    mlp_ratio: 4.0
    num_classes: 1000

# ============================================================
# Diffusion
# ============================================================

diffusion:
  beta_end: 0.02
  beta_start: 0.0001
  cosine_s: 0.008
  learn_sigma: false
  schedule: linear
  timestep: 1000

# ============================================================
# Conditioning
# ============================================================

conditioning:
  enabled: false

# ============================================================
# Loss
# ============================================================

loss:
  diffusion: mse

# ============================================================
# Evaluation
# ============================================================

eval:
  every: 5000

  fid:
    enabled: true
    fid_num_samples: 1000
    sample_batch_size: 64
    ddim_steps: 50
    guidance_scale: 1.0
    eta: 0.0

# ============================================================
# Sampling
# ============================================================

sampling:
  enabled: true
  every: 5000
  save_dir: samples
  checkpoint: null
  diffusion: {}

# ============================================================
# ELT
# ============================================================

elt:
  enabled: false

# ============================================================
# VAE
# ============================================================

vae:
  checkpoint: ./checkpoints/vae_ffhq_256_run4/vae_run4_final.pt